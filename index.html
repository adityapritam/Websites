<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="main">
            <div id="header">
                <div id="logo">
                    <img src="https://www.pngall.com/wp-content/uploads/15/Amazon-Logo-White-Transparent.png" alt="https://icon2.cleanpng.com/lnd/20241213/pz/74d97a469873774f841633779c982d.webp">
                </div>
                <div id="location">
                    <i class="ri-map-pin-line"></i>&nbsp;
                    <div id="flexbox">
                        <p style="color: rgb(210, 207, 207); font-size: small;">Delivering to Ghaziabad 201003</p>
                        <p>Update location</p>
                    </div>
                </div>
                <div id="searchbar"></div>
                <div id="language">
                    <img src="world.png" alt="">&nbsp;
                    <p>EN<i style="font-size: large;" class="ri-arrow-drop-down-fill"></i></p>
                </div>
                <div id="signin">
                    <p style="font-size: small;">Hello, sign in</p>
                    <p style="font-weight: 540;">Account & Lists<i style="font-size: large;" class="ri-arrow-drop-down-fill"></i></p>
                </div>
                <div id="orders">
                    <p style="font-size: small;">Returns</p>
                    <p style="font-weight: 540;">& Orders</p>
                </div>
                <div id="cart"><i style="font-size: xx-large;" class="ri-shopping-cart-line"></i>Cart</div>

            </div>
            <div id="fakeheader"></div>
            
            <div id="content">
                <div id="page1">
                    <div id="navbar"></div>
                </div>
                <div id="page2"></div>
                <div id="page3"></div>
                <div id="page4"></div>
                <div id="page5"></div>

            </div>
        </div>
    </body>
</html>
